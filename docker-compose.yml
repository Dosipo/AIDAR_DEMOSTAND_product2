services:
  situation-center:
    container_name: autodor-situation-center
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  # Профиль для локальной разработки с горячей перезагрузкой (запуск: docker compose --profile dev up)
  situation-center-dev:
    container_name: autodor-situation-center-dev
    image: node:22-alpine
    profiles: ["dev"]
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev"
